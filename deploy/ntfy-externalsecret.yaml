# ntfy publish token for scoby's phone notifications — straight from Vault (secret/web-ntfy,
# the same key the Claude-usage alerts use), never through a shell or git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: scoby-ntfy
  namespace: scoby
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: scoby-ntfy
  data:
    - secretKey: publish-token
      remoteRef:
        key: web-ntfy
        property: publish-token
